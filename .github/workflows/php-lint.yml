name: PHP syntax and link regressions

on:
  push:
    branches: ['main', 'agent/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  code-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, libxml, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint all PHP files
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Check browser JavaScript syntax
        run: find public/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: SQL placeholder regression test
        run: php database/sql-placeholder-test.php
      - name: Editorial links, CMS and public purchase CTA regressions
        run: php tests/links-test.php
      - name: Editor save and Amazon override JavaScript regressions
        run: node --test tests/editor-links.test.cjs
