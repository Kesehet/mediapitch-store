name: PHP syntax check

on:
  push:
    branches: ['main', 'agent/**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: SQL placeholder regression test
        run: php database/sql-placeholder-test.php
      - name: Editorial SEO and draft hardening test
        run: php database/editorial-hardening-test.php
