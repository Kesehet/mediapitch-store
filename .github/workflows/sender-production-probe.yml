name: Sender production status probe

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read Sender production status
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 \
            "https://store.mediapitch.in/cron/sender-status"
          echo
