name: Sender controlled campaign completion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sender-one-time-recovery.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Finish remaining Sender campaign recipients
        shell: bash
        run: |
          set -euo pipefail
          echo "Pass 1:"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 \
            "https://store.mediapitch.in/cron/sender-worker?limit=29"
          echo

          # Newly-created Sender groups are recalculated asynchronously. If pass 1
          # deferred the batch, give Sender time to settle, then reuse that same group.
          sleep 35

          echo "Pass 2:"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 \
            "https://store.mediapitch.in/cron/sender-worker?limit=29"
          echo

          echo "Final status:"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            "https://store.mediapitch.in/cron/sender-status"
          echo
