name: Sender controlled diagnostic retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sender-one-time-recovery.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Run one-recipient Sender diagnostic pass
        shell: bash
        run: |
          set -euo pipefail
          echo "Worker response:"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 \
            "https://store.mediapitch.in/cron/sender-worker?limit=1"
          echo
          echo "Status after worker:"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            "https://store.mediapitch.in/cron/sender-status"
          echo
# controlled retry with endpoint-aware errors
# retry after preserving local batch insert id
# retry after payload-specific 403 cooldown fix
# retry with Sender group/campaign audience readiness gates
