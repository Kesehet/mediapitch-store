name: Public links and CMS editor health

on:
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check public editorial links and CMS editor loading policy
        run: python3 tests/public-links-probe.py
